[colors]
draw_bold_text_with_bright_colors = true

[colors.bright]
black = "0xff262b"
blue = "0x7dc6bf"
cyan = "0x35434d"
green = "0xc3e88d"
magenta = "0x6c71c4"
red = "0xeb606b"
white = "0xffffff"
yellow = "0xf7eb95"

[colors.normal]
black = "0x666666"
blue = "0x80cbc4"
cyan = "0xaeddff"
green = "0xc3e88d"
magenta = "0xff2f90"
red = "0xeb606b"
white = "0xffffff"
yellow = "0xf7eb95"

[colors.primary]
background = "0x1e282d"
foreground = "0xc4c7d1"

[env]
TERM = "xterm-256color"

[font]
size = 10.0

[font.bold]
family = "firacode"

[font.glyph_offset]
x = 0
y = 0

[font.italic]
family = "firacode"

[font.normal]
family = "firacode"

[font.offset]
x = 0
y = 0

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

[terminal]


[terminal.shell]
program = "/bin/bash"

[window]
decorations = "full"

[window.dimensions]
columns = 0
lines = 0

[window.padding]
x = 2
y = 2

